name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm install

      - name: Check JavaScript syntax
        run: npm run check

      - name: Check Python syntax
        run: python -m py_compile mcp_servers\local_files_mcp.py mcp_servers\web_search_mcp.py

      - name: Secret scan
        shell: pwsh
        run: .\scripts\secret_scan.ps1
